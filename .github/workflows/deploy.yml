name: CD — Deploy to cPanel

on:
  workflow_run:
    workflows: ["CI — Test & Lint"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false   # never cancel an in-flight deploy

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    environment:
      name: production
      url: ${{ vars.APP_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- Restore built assets from CI ---
      - name: Download production assets
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: ci.yml
          workflow_conclusion: success
          branch: main
          name: production-assets
          path: public/build/

      # --- Bundle project files (excluding dev & runtime files) ---
      - name: Create deployment bundle
        run: |
          tar -czf /tmp/deploy.tar.gz \
            --warning=no-file-changed \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='storage' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='tests' \
            --exclude='phpunit.xml' \
            --exclude='*.md' \
            --exclude='AGENTS.md' \
            --exclude='CLAUDE.md' \
            --exclude='skills-lock.json' \
            --exclude='boost.json' \
            --exclude='opencode.json' \
            --exclude='.npmrc' \
            --exclude='.editorconfig' \
            .
          mv /tmp/deploy.tar.gz ./deploy.tar.gz

      # --- Put app in maintenance mode first ---
      - name: Put app in maintenance mode
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 45022 }}
          script: |
            cd ${{ secrets.APP_PATH }}
            php artisan down --retry=5 --render="errors::503" --secret="${{ secrets.MAINTENANCE_SECRET }}" || true

      # --- Upload bundle to server via SCP ---
      - name: Upload bundle to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 45022 }}
          source: "deploy.tar.gz"
          target: ${{ secrets.APP_PATH }}

      # --- Run post-deploy commands on server ---
      - name: Run post-deploy commands
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 45022 }}
          script: |
            set -e
            cd ${{ secrets.APP_PATH }}

            # Extract deployment bundle & remove archive
            tar -xzf deploy.tar.gz
            rm -f deploy.tar.gz

            # Install/update dependencies directly on server
            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

            # Migrate database
            php artisan migrate --force

            # Clear & rebuild all caches
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            php artisan event:clear
            php artisan cache:clear
            php artisan optimize

            # Ensure storage link
            php artisan storage:link --relative || true

            # Fix directory permissions
            find storage -type d -exec chmod 755 {} \;
            find storage -type f -exec chmod 644 {} \;
            find bootstrap/cache -type d -exec chmod 755 {} \;

      # --- Bring app back online ---
      - name: Bring app back online
        uses: appleboy/ssh-action@v1
        if: always()
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 45022 }}
          script: |
            cd ${{ secrets.APP_PATH }}
            php artisan up || true

      # --- Notify ---
      - name: Notify deployment result
        if: always()
        run: |
          STATUS="${{ job.status }}"
          COMMIT="${{ github.sha }}"
          SHORT="${COMMIT:0:7}"
          ACTOR="${{ github.actor }}"
          echo "Deployment ${STATUS} — ${SHORT} by ${ACTOR}"
