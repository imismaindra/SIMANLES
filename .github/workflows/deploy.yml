name: CD — Deploy to cPanel

on:
  workflow_run:
    workflows: ["CI — Test & Lint"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false   # never cancel an in-flight deploy

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    environment:
      name: production
      url: ${{ vars.APP_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- Restore built assets from CI ---
      - name: Download production assets
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: ci.yml
          workflow_conclusion: success
          branch: main
          name: production-assets
          path: public/build/

      # --- Put app in maintenance mode first ---
      - name: Put app in maintenance mode
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 45022 }}
          script: |
            cd ${{ secrets.APP_PATH }}
            php artisan down --retry=5 --render="errors::503" --secret="${{ secrets.MAINTENANCE_SECRET }}" || true

      # --- Sync files via SSH (Rsync) — menggantikan FTP lama ---
      - name: Sync files via SSH (Rsync)
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USERNAME }}
          REMOTE_PORT: ${{ secrets.SSH_PORT || 45022 }}
          TARGET: ${{ secrets.APP_PATH }}
          SOURCE: "./"
          ARGS: "-rlgoDzvc -i"
          EXCLUDE: "/.git/, /.github/, /node_modules/, /vendor/, .env, .env.*, /storage/app/, /storage/logs/, /storage/framework/sessions/, /storage/framework/cache/, /tests/, /phpunit.xml, *.md, /AGENTS.md, /CLAUDE.md, /skills-lock.json, /boost.json, /opencode.json, .npmrc, .editorconfig"

      # --- Run post-deploy commands on server ---
      - name: Run post-deploy commands
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 45022 }}
          script: |
            set -e
            cd ${{ secrets.APP_PATH }}

            # Install/update dependencies directly on server
            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

            # Migrate database
            php artisan migrate --force

            # Clear & rebuild all caches
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            php artisan event:clear
            php artisan cache:clear
            php artisan optimize

            # Ensure storage link
            php artisan storage:link --relative || true

            # Fix directory permissions
            find storage -type d -exec chmod 755 {} \;
            find storage -type f -exec chmod 644 {} \;
            find bootstrap/cache -type d -exec chmod 755 {} \;

      # --- Bring app back online ---
      - name: Bring app back online
        uses: appleboy/ssh-action@v1
        if: always()
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 45022 }}
          script: |
            cd ${{ secrets.APP_PATH }}
            php artisan up || true

      # --- Notify ---
      - name: Notify deployment result
        if: always()
        run: |
          STATUS="${{ job.status }}"
          COMMIT="${{ github.sha }}"
          SHORT="${COMMIT:0:7}"
          ACTOR="${{ github.actor }}"
          echo "Deployment ${STATUS} — ${SHORT} by ${ACTOR}"
