name: Hotfix — Emergency Deploy (skip CI)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for hotfix deploy"
        required: true
      skip_migrations:
        description: "Skip database migrations?"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  hotfix:
    name: Hotfix Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment:
      name: production
      url: ${{ vars.APP_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install NPM dependencies
        run: npm ci --prefer-offline

      - name: Build production assets
        run: npm run build

      # --- Bundle project files (excluding dev & runtime files) ---
      - name: Create deployment bundle
        run: |
          tar -czf /tmp/deploy.tar.gz \
            --warning=no-file-changed \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='storage' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='tests' \
            --exclude='phpunit.xml' \
            --exclude='*.md' \
            --exclude='AGENTS.md' \
            --exclude='CLAUDE.md' \
            --exclude='skills-lock.json' \
            --exclude='boost.json' \
            --exclude='opencode.json' \
            --exclude='.npmrc' \
            --exclude='.editorconfig' \
            .
          mv /tmp/deploy.tar.gz ./deploy.tar.gz

      - name: Put app in maintenance mode
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 45022 }}
          script: |
            cd ${{ secrets.APP_PATH }}
            php artisan down --retry=5 || true

      # --- Upload bundle to server via SCP ---
      - name: Upload bundle to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 45022 }}
          source: "deploy.tar.gz"
          target: ${{ secrets.APP_PATH }}

      - name: Post-deploy commands
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 45022 }}
          script: |
            set -e
            cd ${{ secrets.APP_PATH }}
            tar -xzf deploy.tar.gz
            rm -f deploy.tar.gz
            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
            ${{ inputs.skip_migrations == 'false' && 'php artisan migrate --force' || 'echo "Skipping migrations"' }}
            php artisan optimize
            php artisan up || true
