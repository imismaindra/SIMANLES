name: Hotfix — Emergency Deploy (skip CI)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for hotfix deploy"
        required: true
      skip_migrations:
        description: "Skip database migrations?"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  hotfix:
    name: Hotfix Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment:
      name: production
      url: ${{ vars.APP_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install NPM dependencies
        run: npm ci --prefer-offline

      - name: Build production assets
        run: npm run build

      - name: Put app in maintenance mode
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 45022 }}
          script: |
            cd ${{ secrets.APP_PATH }}
            php artisan down --retry=5 || true

      - name: Sync files via SSH (Rsync)
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USERNAME }}
          REMOTE_PORT: ${{ secrets.SSH_PORT || 45022 }}
          TARGET: ${{ secrets.APP_PATH }}
          SOURCE: "./"
          ARGS: "-rlgoDzvc -i"
          EXCLUDE: "/.git/, /.github/, /node_modules/, /vendor/, .env, .env.*, /storage/app/, /storage/logs/, /storage/framework/sessions/, /storage/framework/cache/, /tests/, /phpunit.xml, *.md, /AGENTS.md, /CLAUDE.md, /skills-lock.json, /boost.json, /opencode.json, .npmrc, .editorconfig"

      - name: Post-deploy commands
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 45022 }}
          script: |
            set -e
            cd ${{ secrets.APP_PATH }}
            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
            ${{ inputs.skip_migrations == 'false' && 'php artisan migrate --force' || 'echo "Skipping migrations"' }}
            php artisan optimize
            php artisan up || true
